name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Run Pytest
      # Replace this with 'pytest backend/tests' if you have a specific tests folder
      run: |
        pytest || echo "No tests found or tests failed, ensure tests are configured."
      env:
        SECRET_KEY: "test-secret-key"
        DATABASE_URL: "postgresql+asyncpg://stockuser:stockpass@localhost:5432/stockdb"

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install
      
    - name: Run Linter
      working-directory: ./frontend
      run: npm run lint
      
    - name: Run Build
      working-directory: ./frontend
      run: npm run build

name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'
        
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgomp1

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Run Unit Tests
      run: |
        python -m pytest backend/tests/test_indicators.py backend/tests/test_signals.py backend/tests/test_risk_analysis.py backend/tests/test_options_engine.py backend/tests/test_market_data.py -v
      env:
        PYTHONPATH: .
        SECRET_KEY: "test-secret-key"

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm install
      
    - name: Run Linter
      working-directory: ./frontend
      run: npm run lint
      
    - name: Run Build
      working-directory: ./frontend
      run: npm run build
